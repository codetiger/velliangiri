# The image Mesa is built in: Alpine's own armv7 userland, so the build is
# native musl with the same libraries the device's root has.
#
#   docker build --platform linux/arm/v7 -t velliangiri-mesa \
#       -f tools/mesa-sgx/container.conf tools/mesa-sgx/
#
# On an Apple Silicon host it runs under ARM emulation (Docker Desktop has
# it); on a Linux host, qemu-user-static's binfmt handlers.
FROM --platform=linux/arm/v7 alpine:3.24

RUN apk add --no-cache \
        build-base meson samurai pkgconf git \
        python3 py3-mako py3-yaml py3-packaging \
        bison flex \
        libdrm-dev zlib-dev linux-headers expat-dev \
        wayland-dev wayland-protocols \
        libx11-dev libxext-dev libxfixes-dev libxcb-dev libxshmfence-dev \
        libxxf86vm-dev libxrandr-dev

WORKDIR /workspace
