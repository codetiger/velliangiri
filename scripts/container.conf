# Reproducible Debian Bookworm cross-compilation container for Project Velliangiri
FROM debian:bookworm-slim

ENV DEBIAN_FRONTEND=noninteractive

RUN apt-get update && apt-get install -y --no-install-recommends \
    bc \
    bison \
    build-essential \
    ca-certificates \
    clang \
    cpio \
    curl \
    device-tree-compiler \
    file \
    flex \
    gawk \
    gcc-arm-linux-gnueabihf \
    git \
    kmod \
    libelf-dev \
    libncurses-dev \
    libssl-dev \
    lld \
    llvm \
    lzop \
    make \
     pahole \
    python3 \
    python3-cryptography \
    rsync \
    xz-utils \
    zstd \
    && rm -rf /var/lib/apt/lists/*

WORKDIR /workspace
